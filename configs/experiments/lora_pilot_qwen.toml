[experiment]
name = "lora-pilot-qwen"
run_name = "qwen-lora-pilot"
resume = true

[prompt]
template = "ocr_injected"
include_ocr = true
normalize_ocr = false

[training]
output_root = "outputs/training"
train_split = "train"
eval_split = "validation"
train_limit = 256
eval_limit = 64
per_device_train_batch_size = 1
per_device_eval_batch_size = 1
gradient_accumulation_steps = 8
num_train_epochs = 1.0
learning_rate = 0.0002
weight_decay = 0.0
warmup_ratio = 0.03
logging_steps = 5
save_steps = 25
eval_steps = 25
save_total_limit = 2
gradient_checkpointing = true

[lora]
rank = 8
alpha = 16
dropout = 0.05
bias = "none"
