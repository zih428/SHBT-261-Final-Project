[experiment]
name = "finalists"
run_name = "ocr-injected-validation"
split = "validation"
batch_size = 1
resume = true
match_type = "any"
include_semantic_metrics = true

[prompt]
template = "ocr_injected"
include_ocr = true
normalize_ocr = false
ocr_source = "dataset"
max_ocr_tokens = 32

[generation]
max_new_tokens = 8
temperature = 0.0
top_p = 1.0
do_sample = false
