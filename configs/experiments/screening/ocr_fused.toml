[experiment]
name = "screening"
run_name = "ocr-fused-internal-dev"
split = "internal_dev"
batch_size = 1
resume = true
match_type = "any"
include_semantic_metrics = true

[data]
external_ocr_manifest_path = "data/cache/external_ocr/textvqa_internal_dev_rapidocr.jsonl"

[prompt]
template = "ocr_fused"
include_ocr = true
normalize_ocr = true
ocr_source = "fused"

[generation]
max_new_tokens = 8
temperature = 0.0
top_p = 1.0
do_sample = false
